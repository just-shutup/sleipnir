name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # GitHub runner images ship Google Chrome apt sources that
          # intermittently serve broken indexes; they are not needed here.
          sudo find /etc/apt -iname '*google*' -delete
          sudo apt-get update || echo "apt update incomplete; using cached indexes"
          sudo apt-get install -y cmake g++ libssl-dev

      - name: Build
        run: |
          cmake -B build -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p sleipnir-v${GITHUB_REF_NAME#v}
          cp build/apps/sleipnir/sleipnir sleipnir-v${GITHUB_REF_NAME#v}/
          cp -r data plugins sleipnir-v${GITHUB_REF_NAME#v}/
          cp README.md sleipnir-v${GITHUB_REF_NAME#v}/
          tar czf sleipnir-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz sleipnir-v${GITHUB_REF_NAME#v}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: sleipnir-*-linux-x86_64.tar.gz
          generate_release_notes: true
